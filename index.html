            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;

        /* Lớp phủ đen mờ để làm nổi bật nội dung */
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Tiêu đề trang */
        header {
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 3.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            /* Hiệu ứng chữ Neon */
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 40px #00e5ff;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: #ddd;
            letter-spacing: 1px;
        }

        /* Bố cục Grid trưng bày phim */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        /* Thẻ phim (Hiệu ứng kính mờ - Glassmorphism) */
        .anime-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .anime-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
            border: 1px solid rgba(0, 229, 255, 0.5);
        }

        .anime-image {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .anime-info {
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .anime-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
            /* Giới hạn text 2 dòng nếu quá dài */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Nút xem ngay Neon */
        .btn-watch {
            display: inline-block;
            padding: 12px 0;
            width: 100%;
            background: transparent;
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #00e5ff;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 5px rgba(0, 229, 255, 0.2);
        }

        .btn-watch:hover {
            background: #00e5ff;
            color: #000;
            box-shadow: 0 0 15px #00e5ff, 0 0 30px #00e5ff;
        }

        /* Hiệu ứng loading */
        .loading {
            text-align: center;
            font-size: 1.5rem;
            color: #00e5ff;
            grid-column: 1 / -1;
            text-shadow: 0 0 10px #00e5ff;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>ANIME UNIVERSE</h1>
            <p>Trải nghiệm không giới hạn thế giới Anime</p>
        </header>

        <div class="container">
            <div class="anime-grid" id="anime-list">
                <div class="loading">Đang tải phim từ Server...</div>
            </div>
        </div>
    </div>

    <script>
        // LINK APP SCRIPT CỦA BẠN ĐÃ ĐƯỢC GẮN VÀO ĐÂY
        const API_URL = 'https://script.google.com/macros/s/AKfycbzQzZWh4xm8X_t2ipchxipjKHmV74zBnlkc1v3Syqq5D3jDN4RgsN3xp7WVTLMKuCE/exec';

        fetch(API_URL)
            .then(response => response.json()) // Lấy dữ liệu dạng JSON
            .then(data => {
                const animeList = document.getElementById('anime-list');
                animeList.innerHTML = ''; // Xóa chữ loading

                // Lặp qua từng bộ phim từ Sheet
                data.forEach(anime => {
                    // Nếu link ảnh hoặc link phim trống thì dùng ảnh/link mặc định
                    const imgUrl = anime.image ? anime.image : 'https://via.placeholder.com/300x450?text=No+Image';
                    const watchUrl = anime.link ? anime.link : '#';

                    const card = `
                        <div class="anime-card">
                            <img src="${imgUrl}" alt="${anime.title}" class="anime-image" loading="lazy">
                            <div class="anime-info">
                                <h3 class="anime-title">${anime.title}</h3>
                                <a href="${watchUrl}" class="btn-watch" target="_blank">▶ XEM NGAY</a>
                            </div>
                        </div>
                    `;
                    animeList.innerHTML += card;
                });
            })
            .catch(error => {
                console.error('Lỗi tải dữ liệu:', error);
                document.getElementById('anime-list').innerHTML = 
                    '<div class="loading" style="color: #ff0055;">Không thể kết nối với server. Hãy tải lại trang!</div>';
            });
    </script>
</body>
</html>
